[package]
name = "opurom-db"
version = "0.1.0"
edition = "2021"
description = "OPUROM R2 data layer: SQLite FFI, embedded KV, in-memory store, IR migrations"

[lib]
name = "opurom_db"
path = "src/lib.rs"

[[bin]]
name = "opurom-migrate"
path = "src/bin/opurom-migrate.rs"

[dependencies]
serde_json = "1"
# R7: pure-Rust TLS 1.2/1.3 for the PostgreSQL client. The `ring` provider is
# pinned instead of the default aws-lc-rs, which needs cmake and a C toolchain.
rustls = { version = "=0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

[dev-dependencies]
# R7: generates the self-signed certificate used by the TLS conformance tests.
rcgen = { version = "=0.14.10", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
] }
